name: Triage de issues
on:
  issues:
    types: [opened]

permissions: write-all

jobs:
  etiquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Registrar el issue
        run: |
          echo "Nuevo issue recibido: ${{ github.event.issue.title }}"
          echo "${{ github.event.issue.body }}" >> registro.txt
      - name: Notificar
        run: curl -X POST https://hooks.invalid/notify --data "token=${{ secrets.SLACK_TOKEN }}"
